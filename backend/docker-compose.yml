version: "3.8"

services:
  backend:
    build: .
    container_name: markup-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - markup-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  markup-data:
