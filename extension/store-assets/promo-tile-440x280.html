<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Tile 440x280</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 440px;
  height: 280px;
  background: #050505;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(0,255,136,0.1) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.content {
  text-align: center;
  z-index: 1;
}
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
}
.dot {
  width: 10px; height: 10px;
  background: #00ff88;
  border-radius: 50%;
  box-shadow: 0 0 16px rgba(0,255,136,0.4);
}
.brand-text {
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 1.6rem;
  font-weight: 700;
  color: #00ff88;
}
.tagline {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 1.2rem;
}
.badge {
  display: inline-block;
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 0.65rem;
  padding: 0.3rem 0.7rem;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  border-radius: 4px;
  color: #555;
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="content">
  <div class="brand">
    <div class="dot"></div>
    <span class="brand-text">MARKUP</span>
  </div>
  <p class="tagline">Markdown editor with live preview</p>
  <span class="badge">Chrome Extension</span>
</div>
</body>
</html>
