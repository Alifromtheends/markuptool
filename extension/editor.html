<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markup — Editor</title>
<style>
:root {
  --bg: #050505;
  --surface: #0a0a0a;
  --surface-2: #111;
  --border: #1a1a1a;
  --border-hover: #333;
  --text: #e0e0e0;
  --text-dim: #888;
  --accent: #00ff88;
  --accent-dim: #00cc6a;
  --accent-glow: rgba(0,255,136,0.12);
  --danger: #ff3366;
  --warning: #ffaa00;
  --code-bg: #0d0d0d;
  --font-mono: 'SF Mono', Monaco, Inconsolata, 'Fira Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-mono);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
::selection { background: var(--accent); color: var(--bg); }

header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  flex-shrink: 0;
  z-index: 10;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--accent);
}
.brand-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
select, button {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.45rem 0.9rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
select:hover, button:hover { border-color: var(--border-hover); }
button.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}
button.primary:hover { box-shadow: 0 0 20px var(--accent-glow); }

main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}
.editor-pane {
  width: 50%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg);
}
.pane-header {
  height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
#editor {
  flex: 1;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: none;
  outline: none;
  padding: 1.5rem;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  line-height: 1.7;
  resize: none;
  tab-size: 2;
}
.preview-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
#preview {
  flex: 1;
  padding: 2rem 2.5rem;
  overflow-y: auto;
  font-family: var(--font-sans);
  line-height: 1.7;
}
.resizer {
  width: 6px;
  background: var(--border);
  cursor: col-resize;
  transition: background 0.15s;
  flex-shrink: 0;
}
.resizer:hover, .resizer.active { background: var(--accent); }

/* Markdown preview */
#preview h1, #preview h2, #preview h3, #preview h4 {
  font-family: var(--font-mono);
  font-weight: 700;
  margin: 2rem 0 1rem;
  line-height: 1.3;
}
#preview h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-top: 0; }
#preview h2 { font-size: 1.5rem; }
#preview h3 { font-size: 1.2rem; }
#preview h4 { font-size: 1rem; }
#preview p { margin: 1rem 0; color: var(--text-dim); }
#preview a { color: var(--accent); text-decoration: none; }
#preview a:hover { text-decoration: underline; }
#preview ul, #preview ol { margin: 1rem 0; padding-left: 1.5rem; color: var(--text-dim); }
#preview li { margin: 0.3rem 0; }
#preview ul li::marker { color: var(--accent); }
#preview blockquote {
  border-left: 3px solid var(--accent);
  margin: 1.5rem 0;
  padding: 0.5rem 1.5rem;
  background: var(--surface);
  color: var(--text);
}
#preview code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--code-bg);
  padding: 0.15rem 0.4rem;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--accent);
}
#preview pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.2rem;
  margin: 1.5rem 0;
  overflow-x: auto;
}
#preview pre code {
  background: none;
  border: none;
  padding: 0;
  color: var(--text);
  font-size: 0.8rem;
  line-height: 1.6;
}
#preview hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2rem 0;
}
#preview table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.5rem 0;
  font-size: 0.9rem;
}
#preview th, #preview td {
  border: 1px solid var(--border);
  padding: 0.6rem 1rem;
  text-align: left;
}
#preview th {
  background: var(--surface);
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text);
}
#preview tr:nth-child(even) { background: rgba(255,255,255,0.02); }
#preview img { max-width: 100%; border-radius: 4px; margin: 1rem 0; }
#preview input[type="checkbox"] { accent-color: var(--accent); margin-right: 0.5rem; }

/* Themes */
.theme-minimal #preview { background: #fafafa; color: #222; }
.theme-minimal #preview h1, .theme-minimal #preview h2, .theme-minimal #preview h3, .theme-minimal #preview h4 { color: #111; }
.theme-minimal #preview p { color: #555; }
.theme-minimal #preview a { color: #0066cc; }
.theme-minimal #preview blockquote { background: #f0f0f0; border-left-color: #0066cc; color: #333; }
.theme-minimal #preview code { background: #eee; color: #d63384; border-color: #ddd; }
.theme-minimal #preview pre { background: #f5f5f5; border-color: #ddd; }
.theme-minimal #preview pre code { color: #333; }
.theme-minimal #preview th { background: #f0f0f0; }
.theme-minimal #preview hr { border-color: #ddd; }
.theme-minimal #preview table th, .theme-minimal #preview table td { border-color: #ddd; }

.theme-editorial #preview { background: #0c0c0c; color: #ccc; font-family: Georgia, 'Times New Roman', serif; }
.theme-editorial #preview h1, .theme-editorial #preview h2, .theme-editorial #preview h3, .theme-editorial #preview h4 { font-family: Georgia, serif; color: #fff; }
.theme-editorial #preview p { color: #aaa; }
.theme-editorial #preview a { color: #ffaa00; }
.theme-editorial #preview blockquote { background: #141414; border-left-color: #ffaa00; }
.theme-editorial #preview code { background: #141414; color: #ffaa00; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 1rem 1.5rem;
  font-size: 0.8rem;
  z-index: 1000;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* Mobile */
@media (max-width: 768px) {
  .editor-pane { width: 100% !important; position: absolute; z-index: 5; }
  .preview-pane { width: 100% !important; }
  .resizer { display: none; }
  .mobile-toggle { display: flex !important; }
}
.mobile-toggle {
  display: none;
  gap: 0.5rem;
}
.mobile-toggle button {
  padding: 0.3rem 0.6rem;
  font-size: 0.65rem;
}
.mobile-toggle button.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <span>MARKUP</span>
  </div>
  <div class="actions">
    <div class="mobile-toggle">
      <button id="btn-editor" class="active" onclick="showPane('editor')">Edit</button>
      <button id="btn-preview" onclick="showPane('preview')">Preview</button>
    </div>
    <select id="theme" onchange="changeTheme(this.value)">
      <option value="theme-dark">Dark</option>
      <option value="theme-minimal">Minimal</option>
      <option value="theme-editorial">Editorial</option>
    </select>
    <button onclick="exportHTML()">Export HTML</button>
    <button class="primary" onclick="copyHTML()">Copy</button>
  </div>
</header>

<main id="main">
  <div class="editor-pane" id="editorPane">
    <div class="pane-header">
      <span>Markdown</span>
      <span id="wordCount">0 words</span>
    </div>
    <textarea id="editor" placeholder="# Start writing..." spellcheck="false"></textarea>
  </div>
  <div class="resizer" id="resizer"></div>
  <div class="preview-pane" id="previewPane">
    <div class="pane-header">
      <span>Preview</span>
      <span>Live</span>
    </div>
    <div id="preview"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="editor.js"></script>
</body>
</html>
