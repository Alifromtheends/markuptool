<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markup — Markdown to Beautiful Site</title>
<style>
:root {
  --bg: #050505;
  --surface: #0a0a0a;
  --surface-2: #111;
  --border: #1a1a1a;
  --border-hover: #333;
  --text: #e0e0e0;
  --text-dim: #888;
  --accent: #00ff88;
  --accent-dim: #00cc6a;
  --accent-glow: rgba(0,255,136,0.12);
  --danger: #ff3366;
  --warning: #ffaa00;
  --code-bg: #0d0d0d;
  --font-mono: 'SF Mono', Monaco, Inconsolata, 'Fira Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-mono);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

::selection { background: var(--accent); color: var(--bg); }

/* Header */
header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  flex-shrink: 0;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--accent);
}

.brand-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

select, button {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.45rem 0.9rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}

select:hover, button:hover {
  border-color: var(--border-hover);
}

button.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}

button.primary:hover {
  box-shadow: 0 0 20px var(--accent-glow);
}

button.danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

/* Main layout */
main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* Editor pane */
.editor-pane {
  width: 50%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg);
}

.pane-header {
  height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

#editor {
  flex: 1;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: none;
  outline: none;
  padding: 1.5rem;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  line-height: 1.7;
  resize: none;
  tab-size: 2;
}

/* Preview pane */
.preview-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

#preview {
  flex: 1;
  padding: 2rem 2.5rem;
  overflow-y: auto;
  font-family: var(--font-sans);
  line-height: 1.7;
}

/* Resizer */
.resizer {
  width: 6px;
  background: var(--border);
  cursor: col-resize;
  transition: background 0.15s;
  flex-shrink: 0;
}

.resizer:hover, .resizer.active {
  background: var(--accent);
}

/* Markdown styles in preview */
#preview h1, #preview h2, #preview h3, #preview h4 {
  font-family: var(--font-mono);
  font-weight: 700;
  margin: 2rem 0 1rem;
  line-height: 1.3;
}

#preview h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-top: 0; }
#preview h2 { font-size: 1.5rem; }
#preview h3 { font-size: 1.2rem; }
#preview h4 { font-size: 1rem; }

#preview p { margin: 1rem 0; color: var(--text-dim); }
#preview a { color: var(--accent); text-decoration: none; }
#preview a:hover { text-decoration: underline; }

#preview ul, #preview ol { margin: 1rem 0; padding-left: 1.5rem; color: var(--text-dim); }
#preview li { margin: 0.3rem 0; }
#preview ul li::marker { color: var(--accent); }

#preview blockquote {
  border-left: 3px solid var(--accent);
  margin: 1.5rem 0;
  padding: 0.5rem 1.5rem;
  background: var(--surface);
  color: var(--text);
}

#preview code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--code-bg);
  padding: 0.15rem 0.4rem;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--accent);
}

#preview pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.2rem;
  margin: 1.5rem 0;
  overflow-x: auto;
}

#preview pre code {
  background: none;
  border: none;
  padding: 0;
  color: var(--text);
  font-size: 0.8rem;
  line-height: 1.6;
}

#preview hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2rem 0;
}

#preview table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.5rem 0;
  font-size: 0.9rem;
}

#preview th, #preview td {
  border: 1px solid var(--border);
  padding: 0.6rem 1rem;
  text-align: left;
}

#preview th {
  background: var(--surface);
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text);
}

#preview tr:nth-child(even) { background: rgba(255,255,255,0.02); }

#preview img {
  max-width: 100%;
  border-radius: 4px;
  margin: 1rem 0;
}

/* Checkboxes */
#preview input[type="checkbox"] {
  accent-color: var(--accent);
  margin-right: 0.5rem;
}

/* Themes */
.theme-minimal #preview {
  background: #fafafa;
  color: #222;
}
.theme-minimal #preview h1,
.theme-minimal #preview h2,
.theme-minimal #preview h3,
.theme-minimal #preview h4 { color: #111; }
.theme-minimal #preview p { color: #555; }
.theme-minimal #preview a { color: #0066cc; }
.theme-minimal #preview blockquote {
  background: #f0f0f0;
  border-left-color: #0066cc;
  color: #333;
}
.theme-minimal #preview code {
  background: #eee;
  color: #d63384;
  border-color: #ddd;
}
.theme-minimal #preview pre {
  background: #f5f5f5;
  border-color: #ddd;
}
.theme-minimal #preview pre code { color: #333; }
.theme-minimal #preview th { background: #f0f0f0; }
.theme-minimal #preview hr { border-color: #ddd; }
.theme-minimal #preview table th,
.theme-minimal #preview table td { border-color: #ddd; }

.theme-editorial #preview {
  background: #0c0c0c;
  color: #ccc;
  font-family: Georgia, 'Times New Roman', serif;
}
.theme-editorial #preview h1,
.theme-editorial #preview h2,
.theme-editorial #preview h3,
.theme-editorial #preview h4 {
  font-family: Georgia, serif;
  color: #fff;
}
.theme-editorial #preview p { color: #aaa; }
.theme-editorial #preview a { color: #ffaa00; }
.theme-editorial #preview blockquote {
  background: #141414;
  border-left-color: #ffaa00;
}
.theme-editorial #preview code {
  background: #141414;
  color: #ffaa00;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 1rem 1.5rem;
  font-size: 0.8rem;
  z-index: 1000;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Mobile */
@media (max-width: 768px) {
  .editor-pane { width: 100% !important; position: absolute; z-index: 5; }
  .preview-pane { width: 100% !important; }
  .resizer { display: none; }
  .mobile-toggle { display: flex !important; }
}

.mobile-toggle {
  display: none;
  gap: 0.5rem;
}

.mobile-toggle button {
  padding: 0.3rem 0.6rem;
  font-size: 0.65rem;
}

.mobile-toggle button.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <span>MARKUP</span>
  </div>
  <div class="actions">
    <div class="mobile-toggle">
      <button id="btn-editor" class="active" onclick="showPane('editor')">Edit</button>
      <button id="btn-preview" onclick="showPane('preview')">Preview</button>
    </div>
    <select id="theme" onchange="changeTheme(this.value)">
      <option value="theme-dark">Dark</option>
      <option value="theme-minimal">Minimal</option>
      <option value="theme-editorial">Editorial</option>
    </select>
    <button onclick="exportHTML()">Export HTML</button>
    <button class="primary" onclick="copyHTML()">Copy</button>
  </div>
</header>

<main id="main">
  <div class="editor-pane" id="editorPane">
    <div class="pane-header">
      <span>Markdown</span>
      <span id="wordCount">0 words</span>
    </div>
    <textarea id="editor" placeholder="# Start writing..." spellcheck="false"></textarea>
  </div>
  <div class="resizer" id="resizer"></div>
  <div class="preview-pane" id="previewPane">
    <div class="pane-header">
      <span>Preview</span>
      <span>Live</span>
    </div>
    <div id="preview"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// Simple markdown parser
function parseMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```([\w]*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Headers
    .replace(/^###### (.*$)/gim, '<h6>$1</h6>')
    .replace(/^##### (.*$)/gim, '<h5>$1</h5>')
    .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    // Bold / Italic
    .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/___(.*?)___/g, '<strong><em>$1</em></strong>')
    .replace(/__(.*?)__/g, '<strong>$1</strong>')
    .replace(/_(.*?)_/g, '<em>$1</em>')
    // Blockquote
    .replace(/^&gt; (.*$)/gim, '<blockquote>$1</blockquote>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    // Images
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
    // Unordered lists
    .replace(/^- (.*$)/gim, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n)+/g, match => '<ul>' + match + '</ul>')
    // Ordered lists
    .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
    // Checkboxes
    .replace(/^- \[x\] (.*$)/gim, '<li><input type="checkbox" checked disabled> $1</li>')
    .replace(/^- \[ \] (.*$)/gim, '<li><input type="checkbox" disabled> $1</li>')
    // Horizontal rule
    .replace(/^---+$/gim, '<hr>')
    // Tables (simple)
    .replace(/\|(.+)\|/g, (match, content) => {
      const cells = content.split('|').map(c => c.trim()).filter(c => c);
      if (cells.length === 0) return match;
      if (cells.every(c => c.replace(/-/g, '').trim() === '')) return '';
      return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
    })
    // Line breaks
    .replace(/\n/g, '<br>');

  // Fix blockquotes and tables
  html = html.replace(/(<blockquote>.*?<\/blockquote><br>)+/g, match => {
    return '<blockquote>' + match.replace(/<\/blockquote><br><blockquote>/g, '<br>').replace(/<blockquote>/, '').replace(/<\/blockquote>/, '') + '</blockquote>';
  });

  // Wrap table rows
  const tableRegex = /(<tr>.*?<\/tr><br>)+/g;
  html = html.replace(tableRegex, match => {
    const rows = match.split('<br>').filter(r => r.trim());
    if (rows.length < 2) return match;
    // First row becomes header
    const header = rows[0].replace(/<td>/g, '<th>').replace(/<\/td>/g, '</th>');
    const body = rows.slice(1).join('');
    return '<table><thead>' + header + '</thead><tbody>' + body + '</tbody></table>';
  });

  return html;
}

// State
let currentTheme = 'theme-dark';
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const wordCount = document.getElementById('wordCount');

// Default content
const defaultContent = `# Welcome to Markup

A **privacy-first** markdown editor that exports beautiful, single-file websites. No server. No tracking. Just write and ship.

## Features

- **Live preview** as you type
- **Three themes**: Dark, Minimal, Editorial
- **Export** as standalone HTML
- **Auto-save** to local storage
- **Syntax highlighting** for code blocks
- **Tables, checkboxes, blockquotes**

## Code Example

\`\`\`javascript
const markup = {
  write: () => editor.focus(),
  export: () => downloadHTML(),
  theme: (t) => setTheme(t)
};
\`\`\`

## Task List

- [x] Build the editor
- [x] Add live preview

## Pricing

| Plan | Price | Features |

| Free | $0 | Everything |
| Pro | $0 | Also everything |

> "The best code is the code you don't write." — Someone smart

## Getting Started

1. Start typing in the left pane
2. Switch themes with the dropdown
3. Click **Export HTML** to download
4. Deploy anywhere

---

Built with zero dependencies. Your data never leaves your browser.`;

// Load saved or default
editor.value = localStorage.getItem('markup-content') || defaultContent;

// Update preview
function updatePreview() {
  preview.innerHTML = parseMarkdown(editor.value);
  const words = editor.value.trim().split(/\s+/).filter(w => w.length > 0).length;
  wordCount.textContent = words + ' word' + (words !== 1 ? 's' : '');
  localStorage.setItem('markup-content', editor.value);
}

editor.addEventListener('input', updatePreview);
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    updatePreview();
  }
});

// Theme
function changeTheme(theme) {
  preview.classList.remove('theme-dark', 'theme-minimal', 'theme-editorial');
  preview.classList.add(theme);
  currentTheme = theme;
  localStorage.setItem('markup-theme', theme);
}

const savedTheme = localStorage.getItem('markup-theme') || 'theme-dark';
document.getElementById('theme').value = savedTheme;
changeTheme(savedTheme);

// Export
function getThemeCSS(theme) {
  const base = document.querySelector('style').textContent;
  // Extract just the theme rules and base markdown styles
  return base;
}

function exportHTML() {
  const themeClass = currentTheme;
  const content = preview.innerHTML;
  const title = (editor.value.match(/^# (.*$)/m) || ['', 'Exported Document'])[1];

  const exported = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
<style>
:root {
  --bg: #050505; --surface: #0a0a0a; --surface-2: #111;

  --accent: #00ff88; --code-bg: #0d0d0d;
  --font-mono: 'SF Mono', Monaco, Inconsolata, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans); background: var(--bg); color: var(--text);
  line-height: 1.7; max-width: 720px; margin: 0 auto; padding: 3rem 2rem;
}
h1, h2, h3, h4 { font-family: var(--font-mono); font-weight: 700; margin: 2rem 0 1rem; }
h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.2rem; }
p { margin: 1rem 0; color: var(--text-dim); }
a { color: var(--accent); text-decoration: none; }
blockquote { border-left: 3px solid var(--accent); margin: 1.5rem 0; padding: 0.5rem 1.5rem; background: var(--surface); }
code { font-family: var(--font-mono); font-size: 0.85em; background: var(--code-bg); padding: 0.15rem 0.4rem; border-radius: 3px; border: 1px solid var(--border); color: var(--accent); }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 1.2rem; margin: 1.5rem 0; overflow-x: auto; }
pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 0.8rem; }
hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9rem; }
th, td { border: 1px solid var(--border); padding: 0.6rem 1rem; text-align: left; }
th { background: var(--surface); font-family: var(--font-mono); }
tr:nth-child(even) { background: rgba(255,255,255,0.02); }
img { max-width: 100%; border-radius: 4px; }
input[type="checkbox"] { accent-color: var(--accent); margin-right: 0.5rem; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Minimal theme */
.theme-minimal body { background: #fafafa; color: #222; }
.theme-minimal h1, .theme-minimal h2, .theme-minimal h3, .theme-minimal h4 { color: #111; }
.theme-minimal p { color: #555; }
.theme-minimal a { color: #0066cc; }
.theme-minimal blockquote { background: #f0f0f0; border-left-color: #0066cc; }
.theme-minimal code { background: #eee; color: #d63384; border-color: #ddd; }
.theme-minimal pre { background: #f5f5f5; border-color: #ddd; }
.theme-minimal th { background: #f0f0f0; }
.theme-minimal hr { border-color: #ddd; }
.theme-minimal th, .theme-minimal td { border-color: #ddd; }

/* Editorial theme */
.theme-editorial body { background: #0c0c0c; color: #ccc; font-family: Georgia, serif; }
.theme-editorial h1, .theme-editorial h2, .theme-editorial h3, .theme-editorial h4 { font-family: Georgia, serif; color: #fff; }
.theme-editorial p { color: #aaa; }
.theme-editorial a { color: #ffaa00; }
.theme-editorial blockquote { background: #141414; border-left-color: #ffaa00; }
.theme-editorial code { background: #141414; color: #ffaa00; }
</style>
</head>
<body class="${themeClass}">
${content}
</body>
</html>`;

  const blob = new Blob([exported], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported index.html');
}

function copyHTML() {
  const title = (editor.value.match(/^# (.*$)/m) || ['', 'Exported Document'])[1];
  const exported = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
<style>
:root {
  --bg: #050505; --surface: #0a0a0a; --border: #1a1a1a;
  --text: #e0e0e0; --text-dim: #888; --accent: #00ff88; --code-bg: #0d0d0d;
  --font-mono: 'SF Mono', Monaco, Inconsolata, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans); background: var(--bg); color: var(--text);
  line-height: 1.7; max-width: 720px; margin: 0 auto; padding: 3rem 2rem;
}
h1, h2, h3, h4 { font-family: var(--font-mono); font-weight: 700; margin: 2rem 0 1rem; }
h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.2rem; }
p { margin: 1rem 0; color: var(--text-dim); }

blockquote { border-left: 3px solid var(--accent); margin: 1.5rem 0; padding: 0.5rem 1.5rem; background: var(--surface); }

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Resizer
const resizer = document.getElementById('resizer');
const editorPane = document.getElementById('editorPane');
let isResizing = false;

resizer.addEventListener('mousedown', (e) => {
  isResizing = true;
  resizer.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const container = document.getElementById('main');
  const x = e.clientX - container.getBoundingClientRect().left;
  const percent = (x / container.offsetWidth) * 100;
  if (percent > 15 && percent < 85) {
    editorPane.style.width = percent + '%';
  }
});

document.addEventListener('mouseup', () => {
  isResizing = false;
  resizer.classList.remove('active');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// Mobile pane switching
function showPane(pane) {
  if (pane === 'editor') {
    editorPane.style.transform = 'translateX(0)';
    editorPane.style.opacity = '1';
    document.getElementById('btn-editor').classList.add('active');
    document.getElementById('btn-preview').classList.remove('active');
  } else {
    editorPane.style.transform = 'translateX(-100%)';
    editorPane.style.opacity = '0';
    document.getElementById('btn-preview').classList.add('active');
    document.getElementById('btn-editor').classList.remove('active');
  }
}
