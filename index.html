<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markup — Markdown to Beautiful Site</title>
<style>
:root {
  --bg: #050505;
  --surface: #0a0a0a;
  --surface-2: #111;
  --border: #1a1a1a;
  --border-hover: #333;
  --text: #e0e0e0;
  --text-dim: #888;
  --accent: #00ff88;
  --accent-dim: #00cc6a;
  --accent-glow: rgba(0,255,136,0.12);
  --danger: #ff3366;
  --warning: #ffaa00;
  --code-bg: #0d0d0d;
  --font-mono: 'SF Mono', Monaco, Inconsolata, 'Fira Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-mono);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

::selection { background: var(--accent); color: var(--bg); }

/* Header */
header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  flex-shrink: 0;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--accent);
}

.brand-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

select, button {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.45rem 0.9rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}

select:hover, button:hover {
  border-color: var(--border-hover);
}

button.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}

button.primary:hover {
  box-shadow: 0 0 20px var(--accent-glow);
}

button.danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

/* Main layout */
main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* Editor pane */
.editor-pane {
  width: 50%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg);
}

.pane-header {
  height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

#editor {
  flex: 1;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: none;
  outline: none;
  padding: 1.5rem;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  line-height: 1.7;
  resize: none;
  tab-size: 2;
}

/* Preview pane */
.preview-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

#preview {
  flex: 1;
  padding: 2rem 2.5rem;
  overflow-y: auto;
  font-family: var(--font-sans);
  line-height: 1.7;
}

/* Resizer */
.resizer {
  width: 6px;
  background: var(--border);
  cursor: col-resize;
  transition: background 0.15s;
  flex-shrink: 0;
}

.resizer:hover, .resizer.active {
  background: var(--accent);
}

/* Markdown styles in preview */
#preview h1, #preview h2, #preview h3, #preview h4 {
  font-family: var(--font-mono);
  font-weight: 700;
  margin: 2rem 0 1rem;
  line-height: 1.3;
}

#preview h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-top: 0; }
#preview h2 { font-size: 1.5rem; }
#preview h3 { font-size: 1.2rem; }
#preview h4 { font-size: 1rem; }

#preview p { margin: 1rem 0; color: var(--text-dim); }
#preview a { color: var(--accent); text-decoration: none; }
#preview a:hover { text-decoration: underline; }

#preview ul, #preview ol { margin: 1rem 0; padding-left: 1.5rem; color: var(--text-dim); }
#preview li { margin: 0.3rem 0; }
#preview ul li::marker { color: var(--accent); }

#preview blockquote {
  border-left: 3px solid var(--accent);
  margin: 1.5rem 0;
  padding: 0.5rem 1.5rem;
  background: var(--surface);
  color: var(--text);
}

#preview code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--code-bg);
  padding: 0.15rem 0.4rem;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--accent);
}

#preview pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.2rem;
  margin: 1.5rem 0;
  overflow-x: auto;
}

#preview pre code {
  background: none;
  border: none;
  padding: 0;
  color: var(--text);
  font-size: 0.8rem;
  line-height: 1.6;
}

#preview hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2rem 0;
}

#preview table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.5rem 0;
  font-size: 0.9rem;
}

#preview th, #preview td {
  border: 1px solid var(--border);
  padding: 0.6rem 1rem;
  text-align: left;
}

#preview th {
  background: var(--surface);
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text);
}

#preview tr:nth-child(even) { background: rgba(255,255,255,0.02); }

#preview img {
  max-width: 100%;
  border-radius: 4px;
  margin: 1rem 0;
}

/* Checkboxes */
#preview input[type="checkbox"] {
  accent-color: var(--accent);
  margin-right: 0.5rem;
}

/* Themes */
.theme-minimal #preview {
  background: #fafafa;
  color: #222;
}
.theme-minimal #preview h1,
.theme-minimal #preview h2,
.theme-minimal #preview h3,
.theme-minimal #preview h4 { color: #111; }
.theme-minimal #preview p { color: #555; }
.theme-minimal #preview a { color: #0066cc; }
.theme-minimal #preview blockquote {
  background: #f0f0f0;
  border-left-color: #0066cc;
  color: #333;
}
.theme-minimal #preview code {
  background: #eee;
  color: #d63384;
  border-color: #ddd;
}
.theme-minimal #preview pre {
  background: #f5f5f5;
  border-color: #ddd;
}
.theme-minimal #preview pre code { color: #333; }
.theme-minimal #preview th { background: #f0f0f0; }
.theme-minimal #preview hr { border-color: #ddd; }
.theme-minimal #preview table th,
.theme-minimal #preview table td { border-color: #ddd; }

.theme-editorial #preview {
  background: #0c0c0c;
  color: #ccc;
  font-family: Georgia, 'Times New Roman', serif;
}
.theme-editorial #preview h1,
.theme-editorial #preview h2,
.theme-editorial #preview h3,
.theme-editorial #preview h4 {
  font-family: Georgia, serif;
  color: #fff;
}
.theme-editorial #preview p { color: #aaa; }
.theme-editorial #preview a { color: #ffaa00; }
.theme-editorial #preview blockquote {
  background: #141414;
  border-left-color: #ffaa00;
}
.theme-editorial #preview code {
  background: #141414;
  color: #ffaa00;
}

/* Matrix Theme */
.theme-matrix #preview {
  background: #000;
  color: #0f0;
  font-family: var(--font-mono);
  position: relative;
  overflow: hidden;
}
.theme-matrix #preview::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 2;
}
.theme-matrix #preview::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(0,255,0,0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}
.theme-matrix #preview h1,
.theme-matrix #preview h2,
.theme-matrix #preview h3,
.theme-matrix #preview h4 {
  font-family: var(--font-mono);
  color: #0f0;
  text-shadow: 0 0 8px rgba(0,255,0,0.4);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.theme-matrix #preview h1 { border-bottom-color: #0f0; }
.theme-matrix #preview p { color: #00cc00; }
.theme-matrix #preview a { color: #39ff14; text-shadow: 0 0 4px rgba(57,255,20,0.3); }
.theme-matrix #preview blockquote {
  background: rgba(0,255,0,0.05);
  border-left-color: #0f0;
  color: #00e600;
}
.theme-matrix #preview code {
  background: rgba(0,255,0,0.08);
  color: #39ff14;
  border-color: rgba(0,255,0,0.25);
}
.theme-matrix #preview pre {
  background: rgba(0,255,0,0.04);
  border-color: rgba(0,255,0,0.2);
}
.theme-matrix #preview pre code { color: #00ff41; }
.theme-matrix #preview th { background: rgba(0,255,0,0.06); color: #0f0; }
.theme-matrix #preview hr { border-color: rgba(0,255,0,0.2); }
.theme-matrix #preview table th,
.theme-matrix #preview table td { border-color: rgba(0,255,0,0.15); }
.theme-matrix #preview tr:nth-child(even) { background: rgba(0,255,0,0.02); }

/* Paper Theme */
.theme-paper #preview {
  background: #f5f0e8;
  color: #2c1810;
  font-family: 'Courier New', Courier, 'Courier Prime', monospace;
}
.theme-paper #preview::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.6;
  pointer-events: none;
  z-index: 1;
}
.theme-paper #preview h1,
.theme-paper #preview h2,
.theme-paper #preview h3,
.theme-paper #preview h4 {
  font-family: 'Courier New', Courier, monospace;
  color: #1a0f0a;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.theme-paper #preview h1 { border-bottom-color: #c4b5a0; }
.theme-paper #preview p { color: #4a3525; line-height: 1.8; }
.theme-paper #preview a { color: #8b4513; text-decoration: underline; text-decoration-color: #c4b5a0; }
.theme-paper #preview blockquote {
  background: #ebe5da;
  border-left-color: #8b4513;
  color: #3d2b1f;
  font-style: italic;
}
.theme-paper #preview code {
  background: #e8e0d4;
  color: #5c3a21;
  border-color: #d4c8b8;
  font-family: 'Courier New', Courier, monospace;
}
.theme-paper #preview pre {
  background: #ede6d8;
  border-color: #c4b5a0;
}
.theme-paper #preview pre code { color: #2c1810; }
.theme-paper #preview th { background: #ebe5da; color: #1a0f0a; }
.theme-paper #preview hr { border-color: #c4b5a0; }
.theme-paper #preview table th,
.theme-paper #preview table td { border-color: #c4b5a0; }
.theme-paper #preview tr:nth-child(even) { background: rgba(139,69,19,0.03); }

/* Ocean Theme */
.theme-ocean #preview {
  background: linear-gradient(160deg, #0a1628 0%, #0d2137 40%, #0f2d4a 100%);
  color: #c8e6f5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  min-height: 100%;
}
.theme-ocean #preview h1,
.theme-ocean #preview h2,
.theme-ocean #preview h3,
.theme-ocean #preview h4 {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #fff;
  font-weight: 700;
}
.theme-ocean #preview h1 {
  border-bottom-color: rgba(0,212,255,0.2);
  text-shadow: 0 0 20px rgba(0,212,255,0.15);
}
.theme-ocean #preview p { color: #94c4dd; }
.theme-ocean #preview a { color: #00d4ff; }
.theme-ocean #preview blockquote {
  background: rgba(255,255,255,0.04);
  border-left-color: #00d4ff;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 0 6px 6px 0;
}
.theme-ocean #preview code {
  background: rgba(0,212,255,0.08);
  color: #00d4ff;
  border-color: rgba(0,212,255,0.15);
}
.theme-ocean #preview pre {
  background: rgba(0,0,0,0.2);
  border-color: rgba(0,212,255,0.1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.theme-ocean #preview pre code { color: #c8e6f5; }
.theme-ocean #preview th {
  background: rgba(0,212,255,0.06);
  color: #fff;
}
.theme-ocean #preview hr { border-color: rgba(0,212,255,0.1); }
.theme-ocean #preview table th,
.theme-ocean #preview table td { border-color: rgba(0,212,255,0.08); }
.theme-ocean #preview tr:nth-child(even) { background: rgba(0,212,255,0.02); }
.theme-ocean #preview img {
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

/* Brutalist Theme */
.theme-brutalist #preview {
  background: #fff;
  color: #000;
  font-family: system-ui, -apple-system, sans-serif;
}
.theme-brutalist #preview h1,
.theme-brutalist #preview h2,
.theme-brutalist #preview h3,
.theme-brutalist #preview h4 {
  font-family: system-ui, -apple-system, sans-serif;
  color: #000;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.03em;
}
.theme-brutalist #preview h1 {
  font-size: 2.6rem;
  border-bottom: 4px solid #000;
  padding-bottom: 0.6rem;
}
.theme-brutalist #preview h2 { font-size: 1.8rem; border-bottom: 2px solid #000; padding-bottom: 0.3rem; }
.theme-brutalist #preview h3 { font-size: 1.3rem; }
.theme-brutalist #preview p { color: #111; font-weight: 500; }
.theme-brutalist #preview a {
  color: #000;
  background: #ff0000;
  padding: 0 0.2rem;
  font-weight: 700;
  text-decoration: none;
}
.theme-brutalist #preview a:hover { background: #000; color: #fff; }
.theme-brutalist #preview blockquote {
  background: #fff;
  border-left: 6px solid #ff0000;
  color: #000;
  font-weight: 600;
}
.theme-brutalist #preview code {
  background: #000;
  color: #fff;
  border: 2px solid #000;
  border-radius: 0;
  font-family: system-ui, monospace;
  font-weight: 700;
}
.theme-brutalist #preview pre {
  background: #fff;
  border: 3px solid #000;
  border-radius: 0;
}
.theme-brutalist #preview pre code {
  background: #000;
  color: #fff;
  display: block;
  padding: 0.5rem;
}
.theme-brutalist #preview th {
  background: #000;
  color: #fff;
}
.theme-brutalist #preview hr {
  border: none;
  border-top: 4px solid #000;
  margin: 2.5rem 0;
}
.theme-brutalist #preview table th,
.theme-brutalist #preview table td {
  border: 2px solid #000;
  padding: 0.8rem 1rem;
}
.theme-brutalist #preview tr:nth-child(even) { background: #f0f0f0; }
.theme-brutalist #preview img {
  border: 3px solid #000;
  border-radius: 0;
  filter: grayscale(100%) contrast(120%);
}
.theme-brutalist #preview ul li::marker { color: #ff0000; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}
.modal-overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  min-width: 320px;
  max-width: 480px;
  width: 90%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 {
  font-size: 0.85rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  padding: 0.2rem;
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
}
.modal-close:hover { color: var(--text); }
.modal-body {
  padding: 1.25rem;
  overflow-y: auto;
  font-size: 0.8rem;
}
.modal-footer {
  padding: 1rem 1.25rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
}

/* Doc list */
.doc-list { display: flex; flex-direction: column; gap: 0.5rem; }
.doc-item {
  padding: 0.75rem 1rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.doc-item:hover { border-color: var(--accent); }
.doc-item-title { font-size: 0.8rem; color: var(--text); }
.doc-item-meta { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.15rem; }
.doc-item-actions { display: flex; gap: 0.3rem; }
.doc-item-actions button {
  padding: 0.25rem 0.5rem;
  font-size: 0.65rem;
}

/* Share modal */
.share-url {
  display: flex;
  gap: 0.5rem;
  margin: 0.75rem 0;
}
.share-url input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem 0.75rem;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  border-radius: 3px;
  outline: none;
}
.share-qr {
  text-align: center;
  margin: 1rem 0;
}
.share-qr img {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.5rem;
  background: #fff;
}

/* Offline indicator */
.offline-indicator {
  display: none;
  font-size: 0.65rem;
  color: var(--warning);
  border: 1px solid var(--warning);
  padding: 0.2rem 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.offline-indicator.show { display: inline-block; }

/* Pro badge */
.pro-badge {
  display: none;
  font-size: 0.65rem;
  color: var(--bg);
  background: var(--accent);
  padding: 0.15rem 0.5rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.pro-badge.show { display: inline-block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 1rem 1.5rem;
  font-size: 0.8rem;
  z-index: 1000;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Mobile */
@media (max-width: 768px) {
  .editor-pane { width: 100% !important; position: absolute; z-index: 5; }
  .preview-pane { width: 100% !important; }
  .resizer { display: none; }
  .mobile-toggle { display: flex !important; }
}

.mobile-toggle {
  display: none;
  gap: 0.5rem;
}

.mobile-toggle button {
  padding: 0.3rem 0.6rem;
  font-size: 0.65rem;
}

.mobile-toggle button.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <span>MARKUP</span>
  </div>
  <div class="actions">
    <div class="mobile-toggle">
      <button id="btn-editor" class="active" onclick="showPane('editor')">Edit</button>
      <button id="btn-preview" onclick="showPane('preview')">Preview</button>
    </div>
    <select id="theme" onchange="changeTheme(this.value)">
      <option value="theme-dark">Dark</option>
      <option value="theme-minimal">Minimal</option>
      <option value="theme-editorial">Editorial</option>
      <option value="theme-matrix">Matrix</option>
      <option value="theme-paper">Paper</option>

// Simple markdown parser
function parseMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```([\w]*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Headers
    .replace(/^###### (.*$)/gim, '<h6>$1</h6>')
    .replace(/^##### (.*$)/gim, '<h5>$1</h5>')
    .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    // Bold / Italic
    .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/___(.*?)___/g, '<strong><em>$1</em></strong>')
    .replace(/__(.*?)__/g, '<strong>$1</strong>')
    .replace(/_(.*?)_/g, '<em>$1</em>')
    // Blockquote
    .replace(/^&gt; (.*$)/gim, '<blockquote>$1</blockquote>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    // Images
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
    // Unordered lists
    .replace(/^- (.*$)/gim, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n)+/g, match => '<ul>' + match + '</ul>')
    // Ordered lists
    .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
    // Checkboxes
    .replace(/^- \[x\] (.*$)/gim, '<li><input type="checkbox" checked disabled> $1</li>')
    .replace(/^- \[ \] (.*$)/gim, '<li><input type="checkbox" disabled> $1</li>')
    // Horizontal rule
    .replace(/^---+$/gim, '<hr>')
    // Tables (simple)
    .replace(/\|(.+)\|/g, (match, content) => {
      const cells = content.split('|').map(c => c.trim()).filter(c => c);
      if (cells.length === 0) return match;
      if (cells.every(c => c.replace(/-/g, '').trim() === '')) return '';
      return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
    })
    // Line breaks
    .replace(/\n/g, '<br>');

  // Fix blockquotes and tables
  html = html.replace(/(<blockquote>.*?<\/blockquote><br>)+/g, match => {
    return '<blockquote>' + match.replace(/<\/blockquote><br><blockquote>/g, '<br>').replace(/<blockquote>/, '').replace(/<\/blockquote>/, '') + '</blockquote>';
  });

  // Wrap table rows
  const tableRegex = /(<tr>.*?<\/tr><br>)+/g;
  html = html.replace(tableRegex, match => {
    const rows = match.split('<br>').filter(r => r.trim());
    if (rows.length < 2) return match;
    // First row becomes header
    const header = rows[0].replace(/<td>/g, '<th>').replace(/<\/td>/g, '</th>');
    const body = rows.slice(1).join('');
    return '<table><thead>' + header + '</thead><tbody>' + body + '</tbody></table>';
  });

  return html;
}

function getApiKey() {
  let key = localStorage.getItem('markup-api-key');
  if (!key) {
    key = crypto.randomUUID();
    localStorage.setItem('markup-api-key', key);
  }
  return key;
}

async function apiRequest(path, method = 'GET', body = null) {
  const url = API_BASE + path;
  const options = {
    method,
    headers: {
      'X-API-Key': getApiKey(),
      'Content-Type': 'application/json'
    }
  };
  if (body) options.body = JSON.stringify(body);
  try {
    const res = await fetch(url, options);
    if (isOffline) { isOffline = false; updateOfflineIndicator(); }
    return res;
  } catch (err) {
    isOffline = true;
    updateOfflineIndicator();
    throw err;
  }
}

// Backend connectivity
async function checkBackend() {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3000);
    const res = await fetch(API_BASE + '/api/me', {
      headers: { 'X-API-Key': getApiKey() },
      signal: controller.signal
    });
    clearTimeout(timer);
    isOffline = !res.ok;
    updateOfflineIndicator();
    if (res.ok) {
      const data = await res.json();
      if (data.subscription_status === 'active') {
        document.getElementById('proBadge').classList.add('show');
      }
    }
  } catch (e) {
    isOffline = true;
    updateOfflineIndicator();
  }
}

  const el = document.getElementById('offlineIndicator');
  if (isOffline) el.classList.add('show');

async function saveToCloud() {
  if (isOffline) { showToast('Offline mode — saved locally'); return; }
  const btn = document.getElementById('btn-save');
  const originalText = btn.textContent;
  btn.textContent = '⏳ Saving...';
  btn.disabled = true;
  const title = (editor.value.match(/^# (.*$)/m) || ['', 'Untitled'])[1];
  try {
    const res = await apiRequest('/api/doc', 'POST', {
      title,
      content: editor.value,
      theme: currentTheme
    });
    if (res.status === 409 || res.status === 403) {
      btn.textContent = originalText;
      btn.disabled = false;
      openModal('upgradeModal');
      return;
    }
    if (!res.ok) throw new Error('Save failed');
    const data = await res.json();
    currentSlug = data.slug;
    showShareModal(data.url);
    showToast('Saved to cloud');
  } catch (e) {
    showToast('Save failed — working offline');
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

  if (!currentSlug) return;
  try {
    const res = await apiRequest(`/api/doc/${currentSlug}/clone`, 'POST');
    if (!res.ok) throw new Error('Clone failed');
    const data = await res.json();
    currentSlug = data.slug;
    closeModal('shareModal');
    showShareModal(data.url);
    showToast('Document cloned');
  } catch (e) {
    showToast('Clone failed');
  }
}

async function openDocsModal() {
  if (isOffline) { showToast('Offline mode — no docs available'); return; }
  openModal('docsModal');
  const list = document.getElementById('docList');
  list.innerHTML = '<div style="color: var(--text-dim); font-size: 0.8rem; padding: 1rem 0;">Loading...</div>';
  try {
    const res = await apiRequest('/api/me/docs');
    if (!res.ok) throw new Error('Failed to load');
    const docs = await res.json();
    if (!docs.length) {
      list.innerHTML = '<div style="color: var(--text-dim); font-size: 0.8rem; padding: 1rem 0;">No documents yet.</div>';
      return;
    }
    list.innerHTML = docs.map(d => `
      <div class="doc-item" onclick="loadDoc('${d.slug}')">
        <div>
          <div class="doc-item-title">${escapeHtml(d.title || 'Untitled')}</div>
          <div class="doc-item-meta">${fmtDate(d.created_at)} · ${d.view_count || 0} views</div>
        </div>
        <div class="doc-item-actions">
          <button onclick="event.stopPropagation(); deleteDoc('${d.slug}')">Delete</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = '<div style="color: var(--danger); font-size: 0.8rem; padding: 1rem 0;">Failed to load documents.</div>';
  }
}

async function loadDoc(slug) {
  try {
    const res = await apiRequest(`/api/doc/${slug}`);
    if (!res.ok) throw new Error('Load failed');
    const data = await res.json();
    editor.value = data.content;
    currentSlug = data.slug || slug;
    if (data.theme) {
      document.getElementById('theme').value = data.theme;
      changeTheme(data.theme);
    }
    updatePreview();
    closeModal('docsModal');
    showToast('Document loaded');
  } catch (e) {
    showToast('Failed to load document');
  }
}

async function deleteDoc(slug) {
  if (!confirm('Delete this document?')) return;
  try {
    const res = await apiRequest(`/api/doc/${slug}`, 'DELETE');
    if (!res.ok) throw new Error('Delete failed');
    openDocsModal();
    showToast('Document deleted');
  } catch (e) {
    showToast('Delete failed');
  }
}

async function startCheckout() {
  const btn = document.getElementById('checkoutBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Redirecting...';
  btn.disabled = true;
  try {
    const apiKey = localStorage.getItem('markup-api-key') || '';
    const res = await apiRequest('/api/checkout/session', 'POST', { api_key: apiKey });
    if (!res.ok) throw new Error('Checkout failed');
    const data = await res.json();
    if (data.url) window.location.href = data.url;
    else throw new Error('No checkout URL');
  } catch (e) {
    showToast('Checkout failed');
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString();
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('show');
  });
});

// Resizer
const resizer = document.getElementById('resizer');
const editorPane = document.getElementById('editorPane');
let isResizing = false;

resizer.addEventListener('mousedown', (e) => {
  isResizing = true;
  resizer.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const container = document.getElementById('main');
  const x = e.clientX - container.getBoundingClientRect().left;
  const percent = (x / container.offsetWidth) * 100;
  if (percent > 15 && percent < 85) {
    editorPane.style.width = percent + '%';
  }
});

document.addEventListener('mouseup', () => {
  isResizing = false;
  resizer.classList.remove('active');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// Mobile pane switching
function showPane(pane) {
  if (pane === 'editor') {
    editorPane.style.transform = 'translateX(0)';
    editorPane.style.opacity = '1';
    document.getElementById('btn-editor').classList.add('active');
    document.getElementById('btn-preview').classList.remove('active');
  } else {
    editorPane.style.transform = 'translateX(-100%)';
    editorPane.style.opacity = '0';
    document.getElementById('btn-preview').classList.add('active');
    document.getElementById('btn-editor').classList.remove('active');
  }
}

// Handle Stripe checkout redirect
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('checkout') === 'success') {
  showToast('🎉 Welcome to Pro! Your subscription is active.');
  history.replaceState(null, '', window.location.pathname);
} else if (urlParams.get('checkout') === 'cancel') {
  showToast('Upgrade cancelled. You can upgrade anytime.');
  history.replaceState(null, '', window.location.pathname);
}

// Init
getApiKey();
checkBackend();
updatePreview();
</script>
</body>
</html>
